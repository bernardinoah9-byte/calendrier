<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>1er Chapitre : Quand tout allait bien. 💌</title>
<style>
  :root{
    --bg:#0f1021; --card:#1a1b36; --card2:#232548;
    --accent:#ff6b9d; --accent2:#ffd166; --good:#2ecc71; --bad:#e74c3c;
    --text:#f4f4ff; --muted:#a3a4c7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #2a2b55 0%, var(--bg) 60%);
    color:var(--text);display:flex;justify-content:center;padding:24px 16px 48px;
  }
  .wrap{width:100%;max-width:440px;}
  h1{font-size:1.5rem;margin:.2rem 0 .1rem;text-align:center;}
  .sub{text-align:center;color:var(--muted);font-size:.9rem;margin:0 0 18px;}

  .board{
    position:relative;width:100%;aspect-ratio:4/5;border-radius:20px;overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.45);background:#0a0b18;touch-action:none;user-select:none;
  }
  .piece{
    position:absolute;background-repeat:no-repeat;cursor:grab;border-radius:6px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.18), inset 0 0 0 2px rgba(0,0,0,.35);
    filter:grayscale(1) brightness(.55);
    transition:left .22s ease, top .22s ease, border-radius .4s, box-shadow .4s, transform .15s, filter .5s ease;
    will-change:left,top,transform;
  }
  .piece.ok{filter:none;}
  .piece.sel{box-shadow:inset 0 0 0 3px var(--accent2);z-index:4;transform:scale(.96);}
  .piece.drag{transition:none;z-index:10;cursor:grabbing;box-shadow:0 12px 30px rgba(0,0,0,.6), inset 0 0 0 2px var(--accent2);}
  .board.solved .piece{border-radius:0;box-shadow:none;cursor:default;}
  .cap{position:absolute;left:0;right:0;bottom:0;padding:28px 16px 14px;z-index:5;
    background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.6));
    opacity:0;transform:translateY(10px);transition:opacity .5s .3s, transform .5s .3s;pointer-events:none;}
  .board.solved .cap{opacity:1;transform:none;}
  .cap b{display:block;font-size:1.05rem;}
  .cap span{color:#ffe;opacity:.85;font-size:.82rem;}

  .status{display:flex;justify-content:space-between;align-items:center;gap:10px;
    margin:12px 2px 0;color:var(--muted);font-size:.85rem;}
  .status b{color:var(--text);font-variant-numeric:tabular-nums;}
  .status button{background:none;border:1px solid rgba(255,255,255,.18);color:var(--muted);
    padding:7px 14px;border-radius:999px;cursor:pointer;font-size:.8rem;}
  .status button:hover{border-color:var(--accent);color:var(--text);}
  .done{margin-top:12px;text-align:center;font-weight:700;color:var(--accent2);display:none;}
  .done.show{display:block;}

  .quiz{margin-top:22px;transition:opacity .4s, filter .4s;}
  .quiz.locked{opacity:.35;filter:blur(2px);pointer-events:none;}
  .lockmsg{text-align:center;color:var(--muted);font-size:.85rem;margin:18px 0 -8px;}
  .q{background:var(--card);border-radius:16px;padding:16px 16px 10px;margin-bottom:14px;
     border:1px solid rgba(255,255,255,.06);}
  .q p{margin:0 0 12px;font-weight:600;}
  .opt{display:block;width:100%;text-align:left;border:1px solid rgba(255,255,255,.1);
    background:var(--card2);color:var(--text);padding:12px 14px;border-radius:12px;
    margin-bottom:8px;font-size:.95rem;cursor:pointer;transition:.15s;}
  .opt:hover{border-color:var(--accent);}
  .opt.correct{background:rgba(46,204,113,.18);border-color:var(--good);}
  .opt.wrong{background:rgba(231,76,60,.16);border-color:var(--bad);}
  .opt:disabled{cursor:default;}
  .result{text-align:center;font-weight:700;font-size:1.1rem;padding:16px;border-radius:16px;
    background:var(--card);display:none;}
  .result.show{display:block;}
  .reset{display:block;margin:18px auto 0;background:none;border:1px solid var(--muted);
    color:var(--muted);padding:9px 18px;border-radius:999px;cursor:pointer;font-size:.85rem;}
  @media (prefers-reduced-motion:reduce){.piece,.cap,.quiz{transition:none;}}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>

  <div class="board" id="board">
    <div class="cap"><b id="capTitle"></b><span id="capSub"></span></div>
  </div>
  <div class="status">
    <span>Coups : <b id="moves">0</b> · Bien placées : <b id="okCount">0</b></span>
    <button id="shuffle">🔀 Mélanger</button>
  </div>
  <div class="done" id="done"></div>

  <p class="lockmsg" id="lockmsg">🔒 Reconstitue la photo pour débloquer les questions</p>
  <div class="quiz locked" id="quiz"></div>
</div>

<script>window.PHOTO="photo.jpg";</script>
<script>
/* =========================================================
   ✏️  TOUT CE QUI SE MODIFIE EST ICI
   ========================================================= */
const CONFIG = {
  title: "1er Chapitre : Quand tout allait bien. 💌",
  subtitle: "Glisse les pièces (ou touche-en deux) pour les échanger : chaque pièce bien placée reprend ses couleurs.",

  // Légende affichée sur la photo une fois le puzzle terminé
  photoTitle: "Le tout premier shooting",
  photoSub: "Confinement · quand tout allait bien",

  // 👉 Pour mettre TA photo : colle son lien entre les guillemets.
  //    Laisse "" pour garder le dessin par défaut.
  photoUrl: window.PHOTO || "",

  // Difficulté : nombre de colonnes et de lignes (3×3 = 9 pièces, 4×4 = 16 pièces…)
  puzzle: { cols: 4, rows: 4 },

  // Les questions. correct = numéro de la bonne réponse (0 = la 1ère).
  questions: [
    { q: "1. Origine de ce premier shooting photo :",
      options: ["L'amour pur et puissant tah l'époque",
                "Une marque de bière nulle à chier",
                "Afficher notre vie sur les réseaux vu que mtn t'es une influ askip"],
      correct: 1 },
    { q: "2. Notre première embrouille pendant ce confinement (traumatisme n°1) :",
      options: ["Un message d'anniversaire",
                "Le côté du lit",
                "Le fait que tu sois incapable d'annoncer correctement à la contrée"],
      correct: 0 },
    { q: "3. Est-ce que Steven était déjà une sombre merde à l'époque ?",
      options: ["Oui", "Oui mais pas révélé aux grands jours", "Non c'est une superbe personne"],
      correct: 1 },
    { q: "4. Quelle musique représente le plus le confinement pour toi ?",
      options: ["Christophe Maé · On s'attache", "Pino D'Angiò · Ma quale idea",
                "Ninho · La vie qu'on mène", "Gradur · Terrasser"],
      correct: 1 },
  ],

  endMessage: "Chapitre 2 bientôt… 👀", // laisse "" pour afficher juste le score, ou mets un mot perso
};
/* ========================================================= */
{
const $=id=>document.getElementById(id);
$('title').textContent=CONFIG.title;
$('subtitle').textContent=CONFIG.subtitle;
$('capTitle').textContent=CONFIG.photoTitle;
$('capSub').textContent=CONFIG.photoSub;

// --- Image du puzzle : ta photo, ou le dessin par défaut ---
function defaultScene(){
  const c=document.createElement('canvas'); c.width=800; c.height=600;
  const x=c.getContext('2d');
  let g=x.createLinearGradient(0,0,0,600);
  g.addColorStop(0,'#ffd6a5'); g.addColorStop(.28,'#ff9a8b'); g.addColorStop(.55,'#ff6a88'); g.addColorStop(1,'#6a5acd');
  x.fillStyle=g; x.fillRect(0,0,800,600);
  g=x.createRadialGradient(400,228,0,400,228,200);
  g.addColorStop(0,'rgba(255,220,140,.7)'); g.addColorStop(1,'rgba(255,210,120,0)');
  x.fillStyle=g; x.fillRect(0,0,800,600);
  g=x.createRadialGradient(400,228,0,400,228,82);
  g.addColorStop(0,'#fff6d5'); g.addColorStop(.45,'#ffe08a'); g.addColorStop(1,'#ffb24d');
  x.fillStyle=g; x.beginPath(); x.arc(400,228,82,0,Math.PI*2); x.fill();
  g=x.createLinearGradient(0,396,0,600);
  g.addColorStop(0,'rgba(91,134,196,.95)'); g.addColorStop(1,'rgba(58,90,151,.95)');
  x.fillStyle=g; x.fillRect(0,396,800,204);
  x.fillStyle='rgba(255,224,150,.55)';
  for(let i=0;i<7;i++){const w=150-i*18; x.fillRect(400-w/2,412+i*24,w,4);}
  g=x.createLinearGradient(0,330,0,600);
  g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,.45)');
  x.fillStyle=g; x.fillRect(0,0,800,600);
  return c.toDataURL('image/jpeg',.9);
}
const SRC=CONFIG.photoUrl||defaultScene();

// --- Puzzle ---
const board=$('board');
const cols=Math.max(2,CONFIG.puzzle.cols|0), rows=Math.max(2,CONFIG.puzzle.rows|0), N=cols*rows;
const pieces=[]; let order=[]; let moves=0, solved=false, selected=null;

for(let id=0;id<N;id++){
  const el=document.createElement('div'); el.className='piece';
  const c=id%cols, r=Math.floor(id/cols);
  el.style.width=(100/cols)+'%'; el.style.height=(100/rows)+'%';
  el.style.backgroundImage=`url("${SRC}")`;
  el.style.backgroundSize=`${cols*100}% ${rows*100}%`;
  el.style.backgroundPosition=`${c/(cols-1)*100}% ${r/(rows-1)*100}%`;
  el.dataset.id=id;
  board.insertBefore(el,board.firstChild);
  pieces.push(el);
}

function place(cell){
  const el=pieces[order[cell]];
  el.style.left=(cell%cols)*(100/cols)+'%';
  el.style.top=Math.floor(cell/cols)*(100/rows)+'%';
}
function update(){
  let ok=0; order.forEach((p,cell)=>{ const good=p===cell; if(good) ok++; pieces[p].classList.toggle('ok',good); });
  $('moves').textContent=moves; $('okCount').textContent=`${ok}/${N}`;
  if(ok===N && !solved) win();
}
function shuffle(){
  order=[...Array(N).keys()];
  do{ for(let i=N-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]];} }
  while(order.filter((p,c)=>p===c).length>Math.floor(N/4));
  moves=0; solved=false; board.classList.remove('solved'); $('done').classList.remove('show');
  clearSel(); order.forEach((_,c)=>place(c)); update();
}
function swap(a,b){
  if(a===b) return;
  [order[a],order[b]]=[order[b],order[a]]; place(a); place(b); moves++; update();
}
function cellOf(el){ return order.indexOf(+el.dataset.id); }
function clearSel(){ if(selected){selected.classList.remove('sel'); selected=null;} }

function win(){
  solved=true; clearSel(); board.classList.add('solved');
  const d=$('done'); d.textContent=`✨ Bravo, reconstitué en ${moves} coup${moves>1?'s':''} !`; d.classList.add('show');
  $('quiz').classList.remove('locked'); $('lockmsg').style.display='none';
}

// Glisser-déposer + touche/touche
let drag=null;
board.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.piece'); if(!el||solved) return;
  e.preventDefault(); el.setPointerCapture(e.pointerId);
  drag={el,x:e.clientX,y:e.clientY,moved:false};
});
board.addEventListener('pointermove',e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!drag.moved && Math.hypot(dx,dy)>6){ drag.moved=true; clearSel(); drag.el.classList.add('drag'); }
  if(drag.moved) drag.el.style.transform=`translate(${dx}px,${dy}px)`;
});
function endDrag(e){
  if(!drag) return;
  const {el,moved}=drag; drag=null;
  el.classList.remove('drag'); el.style.transform='';
  if(moved){
    const r=board.getBoundingClientRect();
    const c=Math.min(cols-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*cols)));
    const rw=Math.min(rows-1,Math.max(0,Math.floor((e.clientY-r.top)/r.height*rows)));
    swap(cellOf(el), rw*cols+c);
  }else if(!selected){ selected=el; el.classList.add('sel'); }
  else if(selected===el){ clearSel(); }
  else { const a=cellOf(selected); clearSel(); swap(a,cellOf(el)); }
}
board.addEventListener('pointerup',endDrag);
board.addEventListener('pointercancel',e=>{ if(drag){drag.el.classList.remove('drag');drag.el.style.transform='';drag=null;} });
$('shuffle').addEventListener('click',shuffle);
shuffle();

// --- QCM ---
const quizEl=$('quiz');
CONFIG.questions.forEach(item=>{
  const q=document.createElement('div'); q.className='q';
  const p=document.createElement('p'); p.textContent=item.q; q.appendChild(p);
  item.options.forEach((txt,i)=>{
    const b=document.createElement('button'); b.className='opt'; b.textContent=txt;
    b.addEventListener('click',()=>answer(q,b,i,item.correct));
    q.appendChild(b);
  });
  quizEl.appendChild(q);
});
const resultEl=document.createElement('div'); resultEl.className='result';
quizEl.appendChild(resultEl);
const resetBtn=document.createElement('button'); resetBtn.className='reset'; resetBtn.textContent='↺ Rejouer';
resetBtn.addEventListener('click',()=>location.reload());
quizEl.appendChild(resetBtn);

let answered=0, score=0;
function answer(q,btn,i,correct){
  q.querySelectorAll('.opt').forEach(x=>x.disabled=true);
  if(i===correct){btn.classList.add('correct');score++;}
  else{btn.classList.add('wrong');q.querySelectorAll('.opt')[correct].classList.add('correct');}
  if(++answered===CONFIG.questions.length){
    const n=CONFIG.questions.length;
    resultEl.textContent=`🎉 ${score}/${n} bonne${score>1?'s':''} réponse${score>1?'s':''} !`;
    if(CONFIG.endMessage){
      const s=document.createElement('span'); s.style.cssText='display:block;font-weight:500;color:var(--muted)';
      s.textContent=CONFIG.endMessage; resultEl.appendChild(s);
    }
    resultEl.classList.add('show');
  }
}
}
</script>
</body>
</html>
